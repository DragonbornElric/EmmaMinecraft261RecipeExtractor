plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/crowdcontrol.accesswidener")
}

repositories {
	mavenCentral()
	maven {
		name = 'PaperMC Snapshots'
		url = 'https://repo.papermc.io/repository/maven-snapshots/'
	}
	maven {
		name = 'PaperMC Releases'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// WebSocket client for Twitch EventSub
	include implementation("org.java-websocket:Java-WebSocket:1.5.7")

	// Jackson JSON
	include implementation("com.fasterxml.jackson.core:jackson-core:2.16.0")
	include implementation("com.fasterxml.jackson.core:jackson-annotations:2.16.0")
	include implementation("com.fasterxml.jackson.core:jackson-databind:2.16.0")

	// Adventure text components (used by CC effects for chat messages)
	include implementation("net.kyori:adventure-platform-fabric:6.9.0-SNAPSHOT")

	// Lombok (used extensively by CC codebase)
	compileOnly 'org.projectlombok:lombok:1.18.40'
	annotationProcessor 'org.projectlombok:lombok:1.18.40'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs << "-Xlint:none"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
