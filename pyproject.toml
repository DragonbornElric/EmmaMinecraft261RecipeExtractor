[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emma-minecraft"
version = "0.1.0"
description = "Standalone Minecraft GOAP subsystem — brain-agnostic WebSocket bridge, Emmatone pathfinder, and autonomous agent"
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.6.0",
]

[project.optional-dependencies]
litematica = ["litemapy>=0.9.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["gamer*"]
